{% extends "base.html" %}
{% block title %}2FA Verification · {{ panel_name | default('ZK-VPS-PANEL') }}{% endblock %}
{% block header_title %}Two-Factor Authentication{% endblock %}
{% block content %}
<div style="min-height: 68vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 430px; width: 100%; padding: 2.2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="stat-icon primary" style="width: 54px; height: 54px; margin: 0 auto 1rem; font-size: 1.4rem;">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h2 style="font-size: 1.35rem; font-weight: 800;">Two-Factor Verification</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Enter the 6-digit code from your authenticator app.</p>
        </div>
        <form method="POST" action="{{ url_for('two_factor') }}">
            <div class="form-group">
                <label class="form-label">6-Digit Authenticator Code</label>
                <input type="text" name="code" class="form-control mono" placeholder="000000" maxlength="6" style="text-align: center; font-size: 1.3rem; letter-spacing: 0.3em;" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Verify & Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
