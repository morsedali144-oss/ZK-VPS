{% extends "base.html" %}
{% block title %}Set New Password · {{ panel_name | default('ZK-VPS-PANEL') }}{% endblock %}
{% block header_title %}Set New Password{% endblock %}
{% block content %}
<div style="min-height: 68vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.2rem;">
        <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 1rem; text-align: center;">Choose a New Password</h2>
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
